<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Soft Drop Shadow for Glass Elements (floating over dynamic backgrounds) -->
    <filter id="glass-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <!-- Ambient Core Glow -->
    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- macOS Glass Gradient: Primary Arcs -->
    <linearGradient id="glass-arc-primary" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#93C5FD" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#3B82F6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.55"/>
    </linearGradient>

    <!-- macOS Glass Gradient: Secondary Arcs -->
    <linearGradient id="glass-arc-secondary" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#60A5FA" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.60"/>
    </linearGradient>

    <!-- Top Specular Glaze (Simulating light catching curved glass) -->
    <linearGradient id="specular-glaze" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Central Lens Nucleus -->
    <radialGradient id="iris-lens-core" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#BAE6FD"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="85%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
  </defs>

  <!-- Group with Drop Shadow for real depth over any background -->
  <g filter="url(#glass-depth)">

    <!-- Outer Arc Ring (R=74, Stroke=16) with Rounded Terminals -->
    <g fill="none" stroke-linecap="round">
      <!-- Sector 1: Bottom-Left Base -->
      <path d="M 100.00 174.00 A 74 74 0 0 1 30.46 74.69" 
            stroke="url(#glass-arc-primary)" stroke-width="16"/>

      <!-- Sector 2: Top-Left Arch (Receives strong top illumination) -->
      <path d="M 39.38 57.56 A 74 74 0 0 1 152.33 47.67" 
            stroke="url(#glass-arc-secondary)" stroke-width="16"/>

      <!-- Sector 3: Top-Right Apex before Aperture -->
      <path d="M 164.09 63.00 A 74 74 0 0 1 167.07 131.27" 
            stroke="url(#glass-arc-primary)" stroke-width="16"/>
    </g>

    <!-- Inner Partition Ring (R=44, Stroke=14) with Layered Translucency -->
    <g fill="none" stroke-linecap="round">
      <path d="M 84.95 141.35 A 44 44 0 1 1 128.28 66.29" 
            stroke="url(#glass-arc-secondary)" stroke-width="14"/>
      <path d="M 138.11 78.00 A 44 44 0 0 1 100.00 144.00" 
            stroke="url(#glass-arc-primary)" stroke-width="14"/>
    </g>

    <!-- Inner Specular Rim Highlights (Thin optical glass crest lines) -->
    <g fill="none" stroke="url(#specular-glaze)" stroke-linecap="round">
      <!-- Outer Top Arc Specular -->
      <path d="M 44 54 A 74 74 0 0 1 144 45" stroke-width="2.5" opacity="0.85"/>
      <!-- Inner Top Arc Specular -->
      <path d="M 80 58 A 44 44 0 0 1 120 62" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Central Optical Lens / Iris Core -->
    <circle cx="100" cy="100" r="17" fill="url(#iris-lens-core)" filter="url(#core-glow)"/>
    
    <!-- Micro Glass Reflection on Lens Core -->
    <ellipse cx="96" cy="94" rx="5" ry="3" fill="#FFFFFF" opacity="0.85" transform="rotate(-20 96 94)"/>
  </g>
</svg>
