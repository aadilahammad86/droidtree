<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dynamic Dark OLED Radial Background -->
    <radialGradient id="dyn-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E2433"/>
      <stop offset="60%" stop-color="#121620"/>
      <stop offset="100%" stop-color="#090B0F"/>
    </radialGradient>

    <!-- Drop Shadow for Glass Arcs -->
    <filter id="composed-glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="comp-arc-1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#93C5FD" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#3B82F6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="comp-arc-2" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#60A5FA" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.60"/>
    </linearGradient>

    <radialGradient id="comp-core" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#BAE6FD"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="85%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
  </defs>

  <!-- Dynamic Circular / Full Background -->
  <circle cx="256" cy="256" r="256" fill="url(#dyn-bg)"/>

  <!-- Subtle Inner Specular Border for Depth -->
  <circle cx="256" cy="256" r="254" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Centered Scaled Storage Iris macOS Glass (Fits safely in 72% zone) -->
  <g transform="translate(256, 256) scale(1.65) translate(-100, -100)" filter="url(#composed-glass-shadow)">
    <!-- Outer Arc Ring (R=74, Stroke=16) -->
    <g fill="none" stroke-linecap="round">
      <path d="M 100.00 174.00 A 74 74 0 0 1 30.46 74.69" stroke="url(#comp-arc-1)" stroke-width="16"/>
      <path d="M 39.38 57.56 A 74 74 0 0 1 152.33 47.67" stroke="url(#comp-arc-2)" stroke-width="16"/>
      <path d="M 164.09 63.00 A 74 74 0 0 1 167.07 131.27" stroke="url(#comp-arc-1)" stroke-width="16"/>
    </g>

    <!-- Inner Partition Ring (R=44, Stroke=14) -->
    <g fill="none" stroke-linecap="round">
      <path d="M 84.95 141.35 A 44 44 0 1 1 128.28 66.29" stroke="url(#comp-arc-2)" stroke-width="14"/>
      <path d="M 138.11 78.00 A 44 44 0 0 1 100.00 144.00" stroke="url(#comp-arc-1)" stroke-width="14"/>
    </g>

    <!-- Specular Light Sheen Highlight -->
    <path d="M 44 54 A 74 74 0 0 1 144 45" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 80 58 A 44 44 0 0 1 120 62" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round"/>

    <!-- Central Lens Nucleus -->
    <circle cx="100" cy="100" r="17" fill="url(#comp-core)"/>
    <ellipse cx="96" cy="94" rx="5" ry="3" fill="#FFFFFF" opacity="0.85" transform="rotate(-20 96 94)"/>
  </g>
</svg>
