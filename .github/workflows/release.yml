name: Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Auto-Incrementing Version
        id: versioning
        run: |
          git fetch --tags --force
          
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RAW_VERSION="${TAG_NAME#v}"
            RUN_NUM="${{ github.run_number }}"
            VERSION_CODE=$((1000 + RUN_NUM))
          else
            # Search for highest existing tag
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            echo "Latest found tag: $LATEST_TAG"
            
            if [ -z "$LATEST_TAG" ]; then
              TAG_NAME="v1.0.1"
              RAW_VERSION="1.0.1"
              VERSION_CODE=2
            else
              V_NO_PREFIX="${LATEST_TAG#v}"
              MAJOR=$(echo "$V_NO_PREFIX" | cut -d. -f1)
              MINOR=$(echo "$V_NO_PREFIX" | cut -d. -f2)
              PATCH=$(echo "$V_NO_PREFIX" | cut -d. -f3)
              
              MAJOR=${MAJOR:-1}
              MINOR=${MINOR:-0}
              PATCH=${PATCH:-0}
              
              NEW_PATCH=$((PATCH + 1))
              TAG_NAME="v${MAJOR}.${MINOR}.${NEW_PATCH}"
              RAW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
              VERSION_CODE=$((1000 + ${{ github.run_number }}))
            fi
          fi
          
          echo "Calculated Version Tag: $TAG_NAME"
          echo "Calculated Version Name: $RAW_VERSION"
          echo "Calculated Version Code: $VERSION_CODE"
          
          echo "version_tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Successfully restored release keystore from secrets."
          else
            echo "Keystore secret not configured. Generating high-security production key..."
            keytool -genkey -v -keystore release.keystore -alias droidtree \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass droidtree2026 -keypass droidtree2026 \
              -dname "CN=DroidTree, OU=FOSS, O=AadilAhammad, L=Dubai, ST=Dubai, C=AE"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'droidtree2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'droidtree' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'droidtree2026' }}
          VERSION_NAME: ${{ steps.versioning.outputs.version_name }}
          VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Artifacts & Checksums
        id: prepare_artifacts
        run: |
          VERSION="${{ steps.versioning.outputs.version_tag }}"
          cd app/build/outputs/apk/release
          cp app-release.apk "DroidTree-${VERSION}.apk"
          sha256sum "DroidTree-${VERSION}.apk" > checksums.txt
          echo "artifact_path=app/build/outputs/apk/release/DroidTree-${VERSION}.apk" >> $GITHUB_OUTPUT
          echo "checksum_path=app/build/outputs/apk/release/checksums.txt" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.version_tag }}
          name: "DroidTree ${{ steps.versioning.outputs.version_tag }}"
          files: |
            ${{ steps.prepare_artifacts.outputs.artifact_path }}
            ${{ steps.prepare_artifacts.outputs.checksum_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
