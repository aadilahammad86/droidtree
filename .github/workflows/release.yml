name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Successfully decoded release keystore from secrets."
          else
            echo "Keystore secret not configured. Generating high-security production key..."
            keytool -genkey -v -keystore release.keystore -alias droidtree \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass droidtree2026 -keypass droidtree2026 \
              -dname "CN=DroidTree, OU=FOSS, O=AadilAhammad, L=Dubai, ST=Dubai, C=AE"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'droidtree2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'droidtree' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'droidtree2026' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Artifacts & Checksums
        id: prepare_artifacts
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="v1.0.0"
          fi
          cd app/build/outputs/apk/release
          cp app-release.apk "DroidTree-${VERSION}.apk"
          sha256sum "DroidTree-${VERSION}.apk" > checksums.txt
          echo "artifact_path=app/build/outputs/apk/release/DroidTree-${VERSION}.apk" >> $GITHUB_OUTPUT
          echo "checksum_path=app/build/outputs/apk/release/checksums.txt" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.prepare_artifacts.outputs.artifact_path }}
            ${{ steps.prepare_artifacts.outputs.checksum_path }}
          name: "DroidTree ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
